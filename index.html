<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="google-site-verification" content="JZtyb078dbEx1xQOkxxzVD-k_gqM2mh-_Dn59hmJMJM" />
<title>Durbar</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/img-fix.js"></script>
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/mock.css">
<link rel="stylesheet" href="css/auth-sheet.css">
<link rel="stylesheet" href="css/ai-fab.css">
</head>
<body>

<section class="view active" id="view-home">
  <div id="headerSlot"></div>

  <main class="feed" id="feed">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </main>
</section>

<section class="view" id="view-subject">
  <div class="page-head">
    <h1 class="page-title">Subjects</h1>
    <p class="page-sub">All subjects</p>
  </div>
  <ul class="subject-list" id="subjectList"></ul>
</section>

<section class="view" id="view-mock">
  <div class="page-head">
    <h1 class="page-title">Mock</h1>
    <p class="page-sub">Mock tests and calendar</p>
  </div>
  <div class="mk-root" id="mockRoot"></div>
</section>

<section class="view" id="view-shorts">
  <div class="shorts-feed" id="shortsFeed">
    <div class="shorts-state">
      <div class="shorts-spinner"></div>
      <span>Loading shorts…</span>
    </div>
  </div>
</section>

<div id="navSlot"></div>

<a class="ai-fab" id="aiFab" href="/html/ai.html" aria-label="Ask Durbar AI">
  <span class="ai-fab-text">AI</span>
  <img src="/assets/durbar_ai.png" alt="" onerror="this.remove()">
</a>

<div class="bottom-sheet-overlay" id="sheetOverlay">
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Share Short</div>
    <div class="sheet-subtitle" id="sheetSubtitle"></div>

    <div class="share-options" id="shareOptions">
      <button class="share-option" type="button" data-share="copy">
        <span class="option-icon copy">
          <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
        </span>
        <span class="option-label">Copy Link<span class="option-desc">Copy shareable link</span></span>
      </button>

      <button class="share-option" type="button" data-share="download">
        <span class="option-icon download">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11L12 15.5 16.5 11M5 19.5h14"/></svg>
        </span>
        <span class="option-label">Download Video<span class="option-desc">Save to your device</span></span>
      </button>

      <button class="share-option" type="button" data-share="whatsapp">
        <span class="option-icon whatsapp">
          <svg viewBox="0 0 24 24"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 18.8L4 20zM9 9.5c.3 2 2.5 4.2 4.5 4.5l1.2-1.2-1.8-1-.8.7c-.8-.4-1.5-1.1-1.9-1.9l.7-.8-1-1.8L9 9.5z"/></svg>
        </span>
        <span class="option-label">WhatsApp<span class="option-desc">Share via WhatsApp</span></span>
      </button>

      <button class="share-option" type="button" data-share="native">
        <span class="option-icon native">
          <svg viewBox="0 0 24 24"><path d="M12 15V3.5M7.8 7.7L12 3.5l4.2 4.2M5 11.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7.5"/></svg>
        </span>
        <span class="option-label">Share<span class="option-desc">Share using other apps</span></span>
      </button>
    </div>

    <button class="sheet-close-btn" type="button" id="sheetClose">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/auth-sheet.js"></script>
<script src="js/index.js"></script>

</body>
</html>
