<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Durbar - Photos</title>

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/img-fix.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] { display: none !important; }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button { font-family: inherit; }

    button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.6);
      outline-offset: 2px;
    }

    /* Top navigation */
    .photo-navbar {
      background: rgba(0, 0, 0, 0.8);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      padding: calc(0.8rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0.8rem max(1rem, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      flex-shrink: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .nav-left { display: flex; align-items: center; gap: 1rem; min-width: 0; flex: 1; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.1);
      padding: 0.4rem 1.2rem 0.4rem 1rem;
      border-radius: 40px;
      transition: background 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      min-width: 0;
    }

    #noteTitle {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .photo-counter {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-weight: 500;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      min-height: 40px;
      padding: 0.4rem 0.9rem;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    @media (hover: hover) {
      .back-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; transform: translateX(-3px); }
      .tool-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
    }

    /* Photo grid: column width comes from --min, so it adapts to any screen */
    .photo-grid-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1.5rem max(1.5rem, env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }

    .photo-grid {
      --min: 260px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--min)), 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .photo-grid.compact { --min: 150px; gap: 0.6rem; }

    .photo-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #1a1a1a;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      aspect-ratio: 4 / 3;
      border: none;
      padding: 0;
      display: block;
      width: 100%;
    }

    @media (hover: hover) {
      .photo-item:hover { transform: scale(1.02); box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5); z-index: 2; }
    }

    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .photo-number {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .photo-number i { font-size: 0.6rem; }

    /* Lightbox */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.96);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(4rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) calc(4rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      touch-action: pan-y pinch-zoom;
    }

    .lightbox-overlay.active { display: flex; }

    .lightbox-content { max-width: 100%; max-height: 100%; animation: fadeIn 0.3s ease; }

    .lightbox-content img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 8rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      max-height: calc(100dvh - 8rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 60px rgba(0, 0, 0, 0.8);
    }

    .lightbox-close, .lightbox-nav {
      position: fixed;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #ffffff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .lightbox-close {
      top: calc(1rem + env(safe-area-inset-top));
      right: calc(1rem + env(safe-area-inset-right));
      font-size: 1.3rem;
    }

    .lightbox-nav { top: 50%; transform: translateY(-50%); font-size: 1.4rem; }
    .lightbox-nav.prev { left: calc(1rem + env(safe-area-inset-left)); }
    .lightbox-nav.next { right: calc(1rem + env(safe-area-inset-right)); }

    @media (hover: hover) {
      .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255, 255, 255, 0.25); }
    }

    .lightbox-counter {
      position: fixed;
      bottom: calc(1.2rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      padding: 0.4rem 1.5rem;
      border-radius: 30px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Empty state */
    .empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: auto;
      padding: 4rem 1rem;
      color: rgba(255, 255, 255, 0.5);
    }

    .empty-state i { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
    .empty-state h3 { color: rgba(255, 255, 255, 0.7); margin-bottom: 0.5rem; }

    /* Tablets and phones */
    @media (max-width: 768px) {
      .photo-grid-container { padding: 1rem max(1rem, env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
      .photo-grid { --min: 150px; gap: 0.8rem; }
      .photo-grid.compact { --min: 100px; gap: 0.5rem; }
      .back-btn span, .tool-btn span { display: none; }
      .back-btn { padding: 0.4rem 0.9rem; }
      .lightbox-nav { width: 42px; height: 42px; font-size: 1.1rem; }
      .lightbox-nav.prev { left: calc(0.5rem + env(safe-area-inset-left)); }
      .lightbox-nav.next { right: calc(0.5rem + env(safe-area-inset-right)); }
    }

    @media (max-width: 420px) {
      .photo-grid { --min: 120px; gap: 0.5rem; }
      .photo-grid.compact { --min: 90px; gap: 0.4rem; }
      .photo-item { border-radius: 12px; }
      .nav-info { font-size: 0.8rem; }
    }

    /* Short landscape phones */
    @media (max-height: 480px) and (orientation: landscape) {
      .photo-navbar { padding-top: calc(0.4rem + env(safe-area-inset-top)); padding-bottom: 0.4rem; }
      .lightbox-overlay { padding-top: 1rem; padding-bottom: 1rem; }
      .lightbox-content img { max-height: calc(100vh - 2rem); max-height: calc(100dvh - 2rem); }
      .lightbox-counter { bottom: 0.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

<nav class="photo-navbar">
  <div class="nav-left">
    <button class="back-btn" type="button" id="backBtn" aria-label="Go back">
      <i class="fas fa-arrow-left"></i>
      <span>Back</span>
    </button>
    <div class="nav-info">
      <span id="noteTitle">Photos</span>
      <span class="photo-counter" id="photoCounter">0 photos</span>
    </div>
  </div>
  <div class="nav-right">
    <button class="tool-btn" type="button" id="gridBtn" aria-pressed="false" aria-label="Toggle grid size">
      <i class="fas fa-th"></i>
      <span>Grid</span>
    </button>
  </div>
</nav>

<main class="photo-grid-container">
  <div id="photoGrid" class="photo-grid"></div>
  <div id="emptyState" class="empty-state">
    <i class="fas fa-images"></i>
    <h3>No photos found</h3>
    <p>This note doesn't have any photos yet.</p>
  </div>
</main>

<div class="lightbox-overlay" id="lightboxOverlay" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" type="button" id="lbClose" aria-label="Close"><i class="fas fa-times"></i></button>
  <button class="lightbox-nav prev" type="button" id="lbPrev" aria-label="Previous photo"><i class="fas fa-chevron-left"></i></button>
  <button class="lightbox-nav next" type="button" id="lbNext" aria-label="Next photo"><i class="fas fa-chevron-right"></i></button>
  <div class="lightbox-content">
    <img id="lightboxImage" src="" alt="Photo">
  </div>
  <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
</div>

<script>
  (function () {
    "use strict";

    var params = new URLSearchParams(window.location.search);
    var photosParam = params.get("photos") || "";
    var title = params.get("title") || "Photos";

    var photos = [];
    if (photosParam) {
      photos = photosParam.split("||").map(function (u) {
        try { return decodeURIComponent(u); } catch (e) { return u; }
      }).filter(Boolean);
    }

    var grid = document.getElementById("photoGrid");
    var emptyState = document.getElementById("emptyState");
    var overlay = document.getElementById("lightboxOverlay");
    var lbImage = document.getElementById("lightboxImage");
    var lbCounter = document.getElementById("lightboxCounter");
    var gridBtn = document.getElementById("gridBtn");

    document.getElementById("noteTitle").textContent = title;
    document.title = "Durbar \u00B7 " + title;
    document.getElementById("photoCounter").textContent = photos.length + (photos.length === 1 ? " photo" : " photos");

    var currentIndex = 0;
    var isOpen = false;

    function goBack() {
      if (document.referrer && document.referrer.indexOf(window.location.hostname) !== -1 && history.length > 1) {
        history.back();
      } else {
        window.location.href = "/";
      }
    }

    function show(index) {
      currentIndex = (index + photos.length) % photos.length;
      lbImage.src = photos[currentIndex];
      lbCounter.textContent = (currentIndex + 1) + " / " + photos.length;
    }

    function openLightbox(index) {
      isOpen = true;
      overlay.classList.add("active");
      document.body.style.overflow = "hidden";
      show(index);
    }

    function closeLightbox() {
      isOpen = false;
      overlay.classList.remove("active");
      document.body.style.overflow = "";
    }

    document.getElementById("backBtn").addEventListener("click", goBack);

    if (photos.length === 0) {
      grid.hidden = true;
      gridBtn.hidden = true;
      emptyState.style.display = "flex";
      return;
    }

    photos.forEach(function (url, index) {
      var item = document.createElement("button");
      item.type = "button";
      item.className = "photo-item";
      item.setAttribute("aria-label", "Open photo " + (index + 1));

      var img = document.createElement("img");
      img.src = url;
      img.alt = "Photo " + (index + 1);
      img.loading = "lazy";

      var number = document.createElement("div");
      number.className = "photo-number";
      number.innerHTML = '<i class="fas fa-camera"></i> ' + (index + 1);

      item.appendChild(img);
      item.appendChild(number);
      item.addEventListener("click", function () { openLightbox(index); });
      grid.appendChild(item);
    });

    gridBtn.addEventListener("click", function () {
      var compact = grid.classList.toggle("compact");
      gridBtn.setAttribute("aria-pressed", compact ? "true" : "false");
    });

    document.getElementById("lbClose").addEventListener("click", closeLightbox);
    document.getElementById("lbPrev").addEventListener("click", function (e) { e.stopPropagation(); show(currentIndex - 1); });
    document.getElementById("lbNext").addEventListener("click", function (e) { e.stopPropagation(); show(currentIndex + 1); });

    // Tap on the dark area (not the photo or buttons) closes the viewer
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeLightbox();
    });

    // Swipe left / right on touch screens
    var startX = 0;
    var startY = 0;
    overlay.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    overlay.addEventListener("touchend", function (e) {
      if (!e.changedTouches.length || photos.length < 2) return;
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        show(currentIndex + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    document.addEventListener("keydown", function (e) {
      if (!isOpen) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") show(currentIndex - 1);
      else if (e.key === "ArrowRight") show(currentIndex + 1);
    });
  })();
</script>

</body>
</html>
