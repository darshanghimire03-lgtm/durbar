<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Durbar - PDF Viewer</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/pdf.css">
</head>
<body>

<nav class="pdf-navbar">
  <button class="back-btn" type="button" id="backBtn" aria-label="Go back">
    <i class="fas fa-arrow-left"></i>
    <span>Back</span>
  </button>

  <div class="file-info">
    <div class="file-icon"><i class="fas fa-file-pdf"></i></div>
    <div class="file-details">
      <div class="file-name" id="pdfFileName">Loading PDF...</div>
      <div class="file-meta">
        <span id="pdfFileSize">—</span>
        <span class="dot">•</span>
        <span>PDF Document</span>
      </div>
    </div>
  </div>

  <div class="nav-right">
    <button class="tool-btn" type="button" id="zoomBtn" title="Toggle zoom" aria-pressed="false" aria-label="Toggle zoom">
      <i class="fas fa-search-plus" id="zoomIcon"></i>
      <span>Zoom</span>
    </button>
    <button class="tool-btn download-btn" type="button" id="downloadBtn" title="Download PDF" aria-label="Download PDF">
      <i class="fas fa-download"></i>
      <span>Download</span>
    </button>
  </div>
</nav>

<main class="pdf-viewer-container">
  <div class="pdf-wrapper" id="pdfWrapper">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">Loading PDF document...</div>
    </div>

    <div class="error-state" id="errorState" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <h3>Unable to load PDF</h3>
      <p id="errorText">The PDF document could not be loaded. Please check the URL and try again.</p>
      <div class="error-actions">
        <button class="retry-btn" type="button" id="retryBtn">Try Again</button>
        <button class="retry-btn secondary" type="button" id="openBtn">Open in new tab</button>
      </div>
    </div>

    <iframe id="pdfFrame" src="about:blank" title="PDF document"></iframe>
  </div>
</main>

<script src="/js/pdf.js"></script>

</body>
</html>
