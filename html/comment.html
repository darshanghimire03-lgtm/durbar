<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Comments — Durbar</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/img-fix.js"></script>
<link rel="stylesheet" href="/css/pages.css">
<link rel="stylesheet" href="/css/comment.css">
<link rel="stylesheet" href="/css/sidebar.css">
</head>
<body>

<nav class="side-nav" aria-label="Main">
  <a class="nav-item active" href="/">
    <svg class="fill-on-active" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a.5.5 0 0 1-.5.5H15v-6H9v6H4.5a.5.5 0 0 1-.5-.5V11z"/></svg>
    <span>Home</span>
  </a>
  <a class="nav-item" href="/#shorts">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3.5"/><path d="M10 9.2v5.6l4.6-2.8L10 9.2z"/><path d="M8 4l2 3.2M13 4l2 3.2"/></svg>
    <span>Shorts</span>
  </a>
  <a class="nav-item" href="/#subject">
    <svg class="fill-on-active" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M5 16.5h14M9 20.5v-1.5M15 20.5v-1.5"/></svg>
    <span>Subject</span>
  </a>
  <span class="nav-sep"></span>
  <a class="nav-item" href="/html/profile.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    <span>Profile</span>
  </a>
  <a class="nav-item" href="/html/setting.html">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9M4 12h5M15 12h5"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/><circle cx="12" cy="12" r="2.5"/></svg>
    <span>Settings</span>
  </a>
</nav>

<header class="top-bar">
  <button class="back-btn" type="button" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 class="title">Comments</h1>
</header>

<div class="split">

  <div class="post-container">
    <div class="post-box" id="postBox"></div>
  </div>

  <div class="comments-container">
    <div class="section-label">All comments</div>

    <main class="list" id="list">
      <div class="state">Loading comments…</div>
    </main>

    <div class="composer" id="composer">
      <input type="text" id="commentInput" placeholder="Add a comment" maxlength="500" autocomplete="off" enterkeyhint="send" aria-label="Add a comment">
      <button class="send-btn" type="button" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-6.5L4 12zM11 13.5L20 4"/></svg>
      </button>
    </div>
  </div>

</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/js/comment.js"></script>

</body>
</html>
