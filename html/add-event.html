<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Durbar · Add event</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/img-fix.js"></script>
<link rel="stylesheet" href="/css/pages.css">
<link rel="stylesheet" href="/css/add-event.css">
</head>
<body>

<header class="top-bar">
  <a class="round-btn" id="aeBack" href="/#calender" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <h1 class="page-title" id="aeTitle">Add event</h1>
</header>

<div class="ae-gate" id="aeGate">Checking access...</div>

<main class="ae-form" id="aeForm" hidden>
  <div class="ae-role" id="aeRole"></div>
  <div class="ae-types" id="aeTypes"></div>
  <button class="ae-fld" id="aeSubj" type="button"></button>
  <input class="ae-fld ae-input" id="aeTitleIn" placeholder="Title" maxlength="80">
  <div class="ae-media" id="aeMedia">
    <div class="ae-pbox" id="aePhoto"><span id="aeHint">Tap to upload photo</span></div>
    <textarea class="ae-fld ae-input ae-area" id="aeDesc" rows="4" placeholder="Description"></textarea>
  </div>
  <div id="aeDate"><div class="ae-lb">Date</div><button class="ae-fld" id="aeStart" type="button"></button></div>
  <div id="aeRange">
    <div class="ae-two">
      <div><div class="ae-lb">From</div><button class="ae-fld" id="aeRs" type="button"></button></div>
      <div><div class="ae-lb">To</div><button class="ae-fld" id="aeRe" type="button"></button></div>
    </div>
  </div>
  <div id="aeTime">
    <div class="ae-two">
      <div><div class="ae-lb">Starts</div><input class="ae-fld ae-input" id="aeTs" type="time"></div>
      <div><div class="ae-lb">Ends</div><input class="ae-fld ae-input" id="aeTe" type="time"></div>
    </div>
  </div>
  <input type="file" id="aeFile" accept="image/*" hidden>
  <button class="ae-save" id="aeSave" type="button"></button>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/js/add-event.js"></script>

</body>
</html>
