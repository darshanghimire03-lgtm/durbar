<style>
  .as-overlay { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-end; justify-content: center; background: rgba(12, 31, 74, 0.55); overscroll-behavior: contain; }
  .as-overlay[hidden] { display: none !important; }
  .as-sheet { width: 100%; max-width: 520px; max-height: 94vh; overflow-y: auto; background: #f8fbff; border-radius: 28px 28px 0 0; padding: 12px 26px calc(22px + env(safe-area-inset-bottom)) 26px; font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #111827; animation: asUp 0.3s ease; }
  @keyframes asUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .as-handle { width: 42px; height: 4px; margin: 0 auto 18px auto; border-radius: 2px; background: #d6e2f5; }
  .as-head { display: flex; align-items: center; gap: 16px; }
  .as-head-text { flex: 1; min-width: 0; }
  .as-head-text h2 { font-size: 2rem; font-weight: 700; color: #0c1f4a; letter-spacing: -0.02em; line-height: 1.1; }
  .as-head-text p { margin-top: 6px; font-size: 0.98rem; color: #8a96b0; }
  .as-avatar { position: relative; width: 84px; height: 84px; flex-shrink: 0; border: none; padding: 0; border-radius: 50%; background: #ffffff; box-shadow: 0 8px 20px rgba(61, 123, 228, 0.25); cursor: pointer; }
  .as-avatar:disabled { cursor: default; }
  .as-avatar-circle { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #ffffff; background: #e3ecfb; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .as-avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .as-avatar-circle.has-photo img { display: block; }
  .as-avatar-circle.has-photo .as-avatar-icon { display: none; }
  .as-avatar-icon { width: 42px; height: 42px; fill: #3d7be4; }
  .as-avatar-badge { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 50%; background: #3d7be4; border: 3px solid #ffffff; display: flex; align-items: center; justify-content: center; }
  .as-avatar-badge svg { width: 14px; height: 14px; fill: #ffffff; }
  .as-form { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .as-field { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 10px 0 8px; background: #ffffff; border: 2px solid #d6e2f5; border-radius: 999px; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
  .as-field:focus-within { border-color: #3d7be4; box-shadow: 0 0 0 4px rgba(61, 123, 228, 0.15); }
  .as-field.invalid { border-color: #d93636; }
  .as-field-icon { width: 36px; height: 36px; border-radius: 50%; background: #e3ecfb; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .as-field-icon svg { width: 19px; height: 19px; fill: #3d7be4; }
  .as-field input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 1.05rem; color: #0c1f4a; }
  .as-field input::placeholder { color: #8a96b0; }
  .as-eye { border: none; background: transparent; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .as-eye svg { width: 22px; height: 22px; fill: #6b7a99; }
  .as-hint { font-size: 0.85rem; color: #8a96b0; text-align: center; margin-top: -4px; }
  .as-error { display: none; color: #d93636; font-size: 0.9rem; font-weight: 500; text-align: center; }
  .as-error.visible { display: block; }
  .as-forgot { align-self: flex-end; margin: -4px 12px 0 0; font-size: 0.92rem; font-weight: 600; color: #3d7be4; text-decoration: none; }
  .as-btn { height: 54px; border: none; border-radius: 999px; background: #3d7be4; color: #ffffff; font-family: inherit; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; box-shadow: 0 8px 20px rgba(61, 123, 228, 0.3); transition: background 0.2s ease, transform 0.1s ease, opacity 0.2s ease; }
  .as-btn:active { transform: scale(0.985); background: #2f66c9; }
  .as-btn:disabled { opacity: 0.7; cursor: default; }
  .as-btn svg { width: 22px; height: 22px; stroke: #ffffff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .as-spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.4); border-top-color: #ffffff; animation: asSpin 0.8s linear infinite; display: none; }
  .as-btn.loading .as-spinner { display: block; }
  .as-btn.loading svg { display: none; }
  @keyframes asSpin { to { transform: rotate(360deg); } }
  .as-foot { margin-top: 20px; text-align: center; font-size: 0.95rem; color: #8a96b0; }
  .as-foot strong { color: #3d7be4; font-weight: 700; }
</style>

<div class="as-overlay" id="authSheet" hidden>
  <div class="as-sheet" role="dialog" aria-modal="true" aria-labelledby="asTitle">
    <div class="as-handle"></div>

    <div class="as-head">
      <div class="as-head-text">
        <h2 id="asTitle">Login</h2>
        <p>Access your account to continue</p>
      </div>
      <button type="button" class="as-avatar" id="asAvatar" aria-label="Choose profile photo">
        <span class="as-avatar-circle" id="asAvatarCircle">
          <img id="asAvatarPreview" alt="Profile photo preview">
          <svg class="as-avatar-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </span>
        <span class="as-avatar-badge">
          <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        </span>
      </button>
      <input type="file" id="asPhotoInput" accept="image/*" hidden>
    </div>

    <form class="as-form" id="asForm" novalidate>
      <div class="as-field" id="asEmailField">
        <span class="as-field-icon">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        </span>
        <input type="email" id="asEmail" placeholder="Email address" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false">
      </div>

      <div class="as-field" id="asPasswordField">
        <span class="as-field-icon">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </span>
        <input type="password" id="asPassword" placeholder="Password" autocomplete="current-password">
        <button type="button" class="as-eye" id="asEye" aria-label="Show password">
          <svg viewBox="0 0 24 24"><path id="asEyePath" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
        </button>
      </div>

      <div class="as-hint" id="asHint">Tap the circle to add a profile photo (optional)</div>

      <a class="as-forgot" href="/reset-password/">Forgot password?</a>

      <div class="as-error" id="asError" role="alert"></div>

      <button type="submit" class="as-btn" id="asLoginBtn">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span class="as-spinner"></span>
        <span id="asLoginLabel">Login</span>
      </button>
    </form>

    <div class="as-foot">Powered by <strong>Doroi</strong></div>
  </div>
</div>
