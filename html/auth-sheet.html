<div class="as-overlay" id="authSheet" hidden>
  <div class="as-sheet" role="dialog" aria-modal="true" aria-labelledby="asTitle" aria-describedby="asDesc">
    <div class="as-handle" aria-hidden="true"></div>

    <div class="as-head-text">
      <h2 id="asTitle">Welcome back</h2>
      <p id="asDesc">Sign in to continue to Durbar</p>
    </div>

    <div class="as-form">
      <div class="as-error" id="asError" role="alert" aria-live="assertive"></div>
      <div class="as-info" id="asInfo" role="status" aria-live="polite"></div>

      <div class="as-continue" id="asContinue" hidden>
        <div class="as-account">
          <span class="as-avatar" id="asAvatar" aria-hidden="true"></span>
          <span class="as-account-text">
            <span class="as-account-name" id="asAccountName"></span>
            <span class="as-account-email" id="asAccountEmail"></span>
          </span>
        </div>

        <button type="button" class="as-submit" id="asContinueBtn">
          <span class="as-spinner as-spinner-light" aria-hidden="true"></span>
          <span class="as-continue-label" id="asContinueLabel">Continue</span>
        </button>

        <button type="button" class="as-link as-signout" id="asAnotherBtn">Use another account</button>
      </div>

      <form class="as-email-form" id="asSigninForm" novalidate>
        <label class="as-field">
          <span class="as-label">Email</span>
          <input type="email" id="asEmail" autocomplete="email" inputmode="email" placeholder="you@example.com">
        </label>

        <label class="as-field">
          <span class="as-label">Password</span>
          <span class="as-pass-wrap">
            <input type="password" id="asPassword" autocomplete="current-password" placeholder="Your password">
            <button type="button" class="as-eye" data-target="asPassword" aria-label="Show password">Show</button>
          </span>
        </label>

        <button type="button" class="as-link as-forgot" id="asForgot">Forgot password?</button>

        <button type="submit" class="as-submit" id="asSigninBtn">
          <span class="as-spinner as-spinner-light" aria-hidden="true"></span>
          <span id="asSigninLabel">Sign in</span>
        </button>
      </form>

      <form class="as-email-form" id="asSignupForm" novalidate hidden>
        <label class="as-field">
          <span class="as-label">Email</span>
          <input type="email" id="asRegEmail" autocomplete="email" inputmode="email" placeholder="you@example.com">
        </label>

        <label class="as-field">
          <span class="as-label">Password</span>
          <span class="as-pass-wrap">
            <input type="password" id="asNewPass" autocomplete="new-password" placeholder="At least 6 characters">
            <button type="button" class="as-eye" data-target="asNewPass" aria-label="Show password">Show</button>
          </span>
        </label>

        <button type="submit" class="as-submit" id="asSignupBtn">
          <span class="as-spinner as-spinner-light" aria-hidden="true"></span>
          <span id="asSignupLabel">Create account</span>
        </button>
      </form>

      <div id="asGoogleBlock">
        <div class="as-divider"><span>or</span></div>
        <button type="button" class="as-google" id="asGoogleBtn">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span class="as-spinner" aria-hidden="true"></span>
          <span id="asGoogleLabel">Continue with Google</span>
        </button>
      </div>

      <p class="as-switch" id="asSwitchRow">
        <span id="asSwitchText">New to Durbar?</span>
        <button type="button" class="as-link" id="asSwitchBtn">Create account</button>
      </p>

      <p class="as-legal">
        By continuing you agree to our
        <a href="/terms&service/" target="_blank" rel="noopener">Terms</a> and
        <a href="/privacy-policy/" target="_blank" rel="noopener">Privacy Policy</a>.
      </p>
    </div>

    <div class="as-foot">Powered by <strong>Doroi</strong></div>
  </div>
</div>
