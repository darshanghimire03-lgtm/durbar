<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Durbar - PDF Viewer</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4fa;
      color: #0b1b33;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button { font-family: inherit; }

    button:focus-visible {
      outline: 3px solid rgba(30, 75, 122, 0.45);
      outline-offset: 2px;
    }

    /* Top bar */
    .pdf-navbar {
      background: #ffffff;
      padding: calc(0.8rem + env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) 0.8rem max(1.5rem, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid #e6edf6;
      box-shadow: 0 2px 8px rgba(0, 20, 40, 0.04);
      flex-shrink: 0;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1e4b7a;
      background: #e9eef4;
      padding: 0.4rem 1.2rem 0.4rem 1rem;
      border-radius: 40px;
      transition: background 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .file-info { display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 0; }

    .file-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #fff0f0;
      color: #d44c4c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .file-details { min-width: 0; }

    .file-name {
      font-weight: 600;
      font-size: 1rem;
      color: #0d2b47;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta { font-size: 0.75rem; color: #6a89a8; display: flex; align-items: center; gap: 0.6rem; }
    .file-meta .dot { color: #b8cee3; }

    .nav-right { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }

    .tool-btn {
      background: #eef4fa;
      border: none;
      min-height: 40px;
      padding: 0.5rem 0.9rem;
      border-radius: 12px;
      color: #3d5a78;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tool-btn.download-btn { background: #1e4b7a; color: #ffffff; }

    @media (hover: hover) {
      .back-btn:hover { background: #d0dceb; color: #0a2a4a; transform: translateX(-3px); }
      .tool-btn:hover { background: #dce8f2; color: #0a2a4a; }
      .tool-btn.download-btn:hover { background: #0a2a4a; color: #ffffff; }
    }

    /* Viewer */
    .pdf-viewer-container {
      flex: 1;
      min-height: 0;
      background: #e8edf4;
      padding: 1.5rem max(1.5rem, env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .pdf-wrapper {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 20, 40, 0.08);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .pdf-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Zoomed: iframe grows past the wrapper and the wrapper scrolls */
    .pdf-wrapper.zoomed iframe { width: 140%; height: 140%; }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.3s;
    }

    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e6edf6;
      border-top-color: #1e4b7a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text { margin-top: 1.5rem; color: #3d5a78; font-weight: 500; font-size: 0.95rem; text-align: center; padding: 0 1rem; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 6;
      padding: 2rem;
      text-align: center;
    }

    .error-state.visible { display: flex; }
    .error-state i { font-size: 4rem; color: #d44c4c; margin-bottom: 1rem; }
    .error-state h3 { color: #0d2b47; margin-bottom: 0.5rem; }
    .error-state p { color: #6a89a8; max-width: 400px; }

    .error-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-top: 1.5rem; }

    .retry-btn {
      background: #1e4b7a;
      color: #ffffff;
      border: none;
      min-height: 44px;
      padding: 0.6rem 2rem;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
    }

    .retry-btn.secondary { background: #e9eef4; color: #1e4b7a; }

    /* Tablets and phones */
    @media (max-width: 768px) {
      .pdf-navbar {
        padding: calc(0.6rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0.6rem max(1rem, env(safe-area-inset-left));
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .back-btn { order: 1; }
      .nav-right { order: 2; margin-left: auto; }
      .file-info { order: 3; flex-basis: 100%; }
      .file-icon { width: 32px; height: 32px; font-size: 1rem; }
      .file-name { font-size: 0.9rem; }
      .tool-btn span { display: none; }

      .pdf-viewer-container {
        padding: 0.6rem max(0.6rem, env(safe-area-inset-right)) calc(0.6rem + env(safe-area-inset-bottom)) max(0.6rem, env(safe-area-inset-left));
      }

      .pdf-wrapper { border-radius: 12px; max-width: none; }
    }

    @media (max-width: 480px) {
      .back-btn span { display: none; }
      .back-btn { padding: 0.4rem 0.9rem; }
    }

    /* Short landscape phones: squeeze the header */
    @media (max-height: 480px) and (orientation: landscape) {
      .pdf-navbar { flex-wrap: nowrap; padding-top: calc(0.4rem + env(safe-area-inset-top)); padding-bottom: 0.4rem; }
      .file-info { order: 2; flex-basis: auto; }
      .nav-right { order: 3; margin-left: 0; }
      .pdf-viewer-container { padding-top: 0.4rem; padding-bottom: calc(0.4rem + env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

<nav class="pdf-navbar">
  <button class="back-btn" type="button" id="backBtn" aria-label="Go back">
    <i class="fas fa-arrow-left"></i>
    <span>Back</span>
  </button>

  <div class="file-info">
    <div class="file-icon"><i class="fas fa-file-pdf"></i></div>
    <div class="file-details">
      <div class="file-name" id="pdfFileName">Loading PDF...</div>
      <div class="file-meta">
        <span id="pdfFileSize">—</span>
        <span class="dot">•</span>
        <span>PDF Document</span>
      </div>
    </div>
  </div>

  <div class="nav-right">
    <button class="tool-btn" type="button" id="zoomBtn" title="Toggle zoom" aria-pressed="false" aria-label="Toggle zoom">
      <i class="fas fa-search-plus" id="zoomIcon"></i>
      <span>Zoom</span>
    </button>
    <button class="tool-btn download-btn" type="button" id="downloadBtn" title="Download PDF" aria-label="Download PDF">
      <i class="fas fa-download"></i>
      <span>Download</span>
    </button>
  </div>
</nav>

<main class="pdf-viewer-container">
  <div class="pdf-wrapper" id="pdfWrapper">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">Loading PDF document...</div>
    </div>

    <div class="error-state" id="errorState" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <h3>Unable to load PDF</h3>
      <p id="errorText">The PDF document could not be loaded. Please check the URL and try again.</p>
      <div class="error-actions">
        <button class="retry-btn" type="button" id="retryBtn">Try Again</button>
        <button class="retry-btn secondary" type="button" id="openBtn">Open in new tab</button>
      </div>
    </div>

    <iframe id="pdfFrame" src="about:blank" title="PDF document"></iframe>
  </div>
</main>

<script>
  (function () {
    "use strict";

    var urlParams = new URLSearchParams(window.location.search);
    var pdfUrl = urlParams.get("url");
    var fileName = urlParams.get("name") || "document.pdf";
    var fileSize = urlParams.get("size") || "\u2014";
    var returnUrl = urlParams.get("return") || "/";

    var pdfFrame = document.getElementById("pdfFrame");
    var wrapper = document.getElementById("pdfWrapper");
    var loadingOverlay = document.getElementById("loadingOverlay");
    var errorState = document.getElementById("errorState");
    var errorText = document.getElementById("errorText");
    var zoomBtn = document.getElementById("zoomBtn");
    var zoomIcon = document.getElementById("zoomIcon");

    var loadTimer = null;
    var isZoomed = false;

    document.getElementById("pdfFileName").textContent = fileName;
    document.getElementById("pdfFileSize").textContent = fileSize;
    document.title = "Durbar \u00B7 " + fileName;

    // Only same-site paths are allowed as the "return" target
    if (!/^\/[A-Za-z0-9_\-\/.]*([?#][^\s]*)?$/.test(returnUrl) || returnUrl.indexOf("//") !== -1) {
      returnUrl = "/";
    }

    function showError(message) {
      clearTimeout(loadTimer);
      loadingOverlay.classList.add("hidden");
      errorState.classList.add("visible");
      if (message) errorText.textContent = message;
    }

    function loadPDF() {
      if (!pdfUrl) {
        showError("No PDF URL provided.");
        return;
      }

      errorState.classList.remove("visible");
      loadingOverlay.classList.remove("hidden");
      clearTimeout(loadTimer);

      // Google's viewer works on desktop and mobile browsers that can't embed PDFs
      pdfFrame.onload = function () {
        clearTimeout(loadTimer);
        setTimeout(function () { loadingOverlay.classList.add("hidden"); }, 600);
      };
      pdfFrame.src = "https://docs.google.com/gview?embedded=true&url=" + encodeURIComponent(pdfUrl);

      loadTimer = setTimeout(function () {
        showError("The PDF is taking too long to load. It may be unavailable.");
      }, 20000);
    }

    function goBack() {
      if (document.referrer && document.referrer.indexOf(window.location.hostname) !== -1 && history.length > 1) {
        history.back();
      } else {
        window.location.href = returnUrl;
      }
    }

    function openInNewTab() {
      if (!pdfUrl) return;
      window.open(pdfUrl, "_blank", "noopener");
    }

    function toggleZoom() {
      isZoomed = !isZoomed;
      wrapper.classList.toggle("zoomed", isZoomed);
      zoomBtn.setAttribute("aria-pressed", isZoomed ? "true" : "false");
      zoomIcon.className = isZoomed ? "fas fa-search-minus" : "fas fa-search-plus";
    }

    document.getElementById("backBtn").addEventListener("click", goBack);
    document.getElementById("downloadBtn").addEventListener("click", function () {
      if (!pdfUrl) { showError("No PDF URL available to download."); return; }
      openInNewTab();
    });
    document.getElementById("retryBtn").addEventListener("click", loadPDF);
    document.getElementById("openBtn").addEventListener("click", openInNewTab);
    zoomBtn.addEventListener("click", toggleZoom);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") goBack();
    });

    loadPDF();
  })();
</script>

</body>
</html>
