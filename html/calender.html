<div class="page-head cl-head">
  <div class="cl-t">
    <h1 class="page-title">Calendar</h1>
    <p class="page-sub">Dates and schedule</p>
  </div>
  <button class="cl-add" id="clAdd" type="button" aria-label="Add event" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="cl-card">
  <div class="cl-mh">
    <button class="cl-nav" id="clPrev" type="button" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="cl-mt"><b id="clLabel"></b><span id="clSub"></span></div>
    <button class="cl-nav" id="clNext" type="button" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="cl-wk"><span class="r">SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span class="r">SAT</span></div>
  <div class="cl-grid" id="clGrid"></div>
  <div class="cl-legend">
    <span><i style="background:#EE6B72"></i>Holiday</span>
    <span><i style="background:#5C8DEB"></i>Exam</span>
    <span><i style="background:#F5A54A"></i>Test</span>
    <span><i style="background:#4CAF6A"></i>School event</span>
  </div>
</div>
<div class="cl-lh"><h2>Events this month</h2><a id="clSeeAll" hidden>See all</a></div>
<div class="cl-list" id="clMonthList"></div>
<div class="cl-empty" id="clEmpty" hidden>No events this month</div>
<div class="cl-progress" id="clProgress" hidden><div class="cl-spin"></div></div>
<div class="cl-page" id="clAllPage" hidden>
  <div class="cl-in">
    <div class="cl-ph">
      <button id="clAllBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><b>All events</b><span id="clAllCount"></span></div>
    </div>
    <div id="clAllList"></div>
    <div class="cl-empty" id="clAllEmpty" hidden>No events yet</div>
  </div>
</div>
