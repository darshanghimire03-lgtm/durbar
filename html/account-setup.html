<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8fbff">
<title>Set up your account · Durbar</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/img-fix.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { background: #f8fbff; }
body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: #111827;
  min-height: 100vh; min-height: 100dvh;
  display: flex; justify-content: center;
  padding: calc(28px + env(safe-area-inset-top)) 22px calc(32px + env(safe-area-inset-bottom));
}
.wrap { width: 100%; max-width: 480px; }

.head h1 { font-size: 1.9rem; font-weight: 700; color: #0c1f4a; letter-spacing: -0.02em; line-height: 1.1; }
.head p { margin-top: 6px; font-size: 0.98rem; color: #6b7a99; line-height: 1.45; }

.loading-box { margin-top: 60px; display: flex; justify-content: center; }
.spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid #d6e2f5; border-top-color: #3d7be4;
  animation: spin 0.8s linear infinite;
}
.spinner.light { width: 20px; height: 20px; border-color: rgba(255,255,255,0.4); border-top-color: #fff; display: none; }
.loading .spinner.light { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

form { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }

.error {
  display: none; padding: 10px 14px; border-radius: 12px;
  background: #fdecec; color: #c62828;
  font-size: 0.9rem; font-weight: 500; line-height: 1.4;
}
.error.visible { display: block; }

.photo-block { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px; }
.avatar-btn {
  position: relative; width: 116px; height: 116px; border: 0; padding: 0;
  border-radius: 50%; background: #e6eefc; cursor: pointer;
  box-shadow: 0 0 0 4px #fff, 0 0 0 6px #d6e2f5;
}
.avatar-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; background: #e6eefc; }
.avatar-btn .badge {
  position: absolute; right: -2px; bottom: -2px; width: 38px; height: 38px; border-radius: 50%;
  background: #3d7be4; border: 3px solid #f8fbff;
  display: flex; align-items: center; justify-content: center;
}
.badge svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.photo-actions { display: flex; gap: 16px; align-items: center; min-height: 20px; }
.photo-hint { font-size: 0.85rem; color: #6b7a99; }

.link {
  border: 0; background: none; padding: 0; font-family: inherit;
  font-size: 0.9rem; font-weight: 600; color: #3d7be4; cursor: pointer;
}
.link:hover { text-decoration: underline; }
.link.danger { color: #c62828; }

.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 0.82rem; font-weight: 600; color: #0c1f4a; }
.field input[type="text"], .field input[type="email"], .field input[type="tel"] {
  width: 100%; height: 50px; padding: 0 16px;
  border: 2px solid #d6e2f5; border-radius: 14px; background: #fff;
  font-family: inherit; font-size: 1rem; color: #111827; outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.field input::placeholder { color: #a7b2c9; }
.field input:focus { border-color: #3d7be4; box-shadow: 0 0 0 4px rgba(61, 123, 228, 0.15); }
.field input[readonly] { background: #eef3fc; color: #6b7a99; }

.phone { display: flex; gap: 8px; }
.prefix {
  height: 50px; padding: 0 14px; display: flex; align-items: center;
  border: 2px solid #d6e2f5; border-radius: 14px; background: #eef3fc;
  font-weight: 700; color: #0c1f4a;
}
.phone input { flex: 1; min-width: 0; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg.single { grid-template-columns: 1fr; }
.seg label { position: relative; display: block; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span {
  min-height: 50px; padding: 0 10px; text-align: center; display: flex; align-items: center; justify-content: center;
  border: 2px solid #d6e2f5; border-radius: 14px; background: #fff;
  font-weight: 600; color: #0c1f4a; transition: all 0.15s ease;
}
.seg input:checked + span { border-color: #3d7be4; background: #e6eefc; color: #1f4aa8; box-shadow: 0 0 0 3px rgba(61, 123, 228, 0.15); }
.seg input:focus-visible + span { outline: 3px solid rgba(61, 123, 228, 0.45); outline-offset: 2px; }

.submit {
  margin-top: 6px; height: 54px; border: 0; border-radius: 999px; width: 100%;
  background: #3d7be4; color: #fff;
  font-family: inherit; font-size: 1.05rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; box-shadow: 0 8px 18px rgba(61, 123, 228, 0.3);
  transition: transform 0.1s ease, opacity 0.2s ease;
}
.submit:active { transform: scale(0.985); }
.submit:disabled { opacity: 0.7; cursor: default; }
.avatar-btn:focus-visible, .submit:focus-visible, .link:focus-visible { outline: 3px solid rgba(61, 123, 228, 0.45); outline-offset: 3px; }

.seg.locked { opacity: 0.55; pointer-events: none; }
.field input[readonly] { cursor: not-allowed; }
.avatar-btn:disabled { cursor: default; }
.avatar-btn.locked .badge { display: none; }
.note {
  padding: 10px 14px; border-radius: 12px; background: #e6eefc; color: #1f4aa8;
  font-size: 0.88rem; font-weight: 500; line-height: 1.45;
}

.signout { align-self: center; }
.foot { margin-top: 22px; text-align: center; font-size: 0.9rem; color: #8a96b0; }
.foot strong { color: #3d7be4; font-weight: 700; }
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <h1 id="headTitle">Set up your account</h1>
    <p id="headSub">Add your photo and details so classmates can recognise you.</p>
  </div>

  <div class="loading-box" id="loadingBox"><div class="spinner"></div></div>

  <form id="setupForm" novalidate hidden>
    <div class="error" id="errorBox" role="alert" aria-live="assertive"></div>
    <div class="note" id="lockNote"></div>

    <div class="photo-block">
      <button type="button" class="avatar-btn" id="avatarBtn" aria-label="Choose profile photo">
        <img id="avatarImg" src="/favicon.png" alt="Profile photo">
        <span class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.1-1.6A1.5 1.5 0 0 1 10 3.8h4a1.5 1.5 0 0 1 1.2.6L16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-8z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
        </span>
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="photo-actions">
        <span class="photo-hint" id="photoHint">Tap to add a profile photo</span>
        <button type="button" class="link danger" id="removePhoto" hidden>Remove</button>
      </div>
    </div>

    <label class="field">
      <span class="label">Full name</span>
      <input type="text" id="fullName" autocomplete="name" placeholder="Your full name">
    </label>

    <label class="field">
      <span class="label">Email</span>
      <input type="email" id="email" readonly>
    </label>

    <div class="field">
      <span class="label">Phone number</span>
      <div class="phone">
        <span class="prefix">+977</span>
        <input type="tel" id="phone" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="98XXXXXXXX">
      </div>
    </div>

    <div class="field" role="radiogroup" aria-labelledby="genderLbl">
      <span class="label" id="genderLbl">Gender</span>
      <div class="seg" id="segGender">
        <label><input type="radio" name="gender" value="Male"><span>Male</span></label>
        <label><input type="radio" name="gender" value="Female"><span>Female</span></label>
      </div>
    </div>

    <div class="field" id="subjectField" role="radiogroup" aria-labelledby="subjectLbl" hidden>
      <span class="label" id="subjectLbl">Assigned subject</span>
      <div class="seg" id="segSubject"></div>
    </div>

    <div class="field" role="radiogroup" aria-labelledby="classLbl">
      <span class="label" id="classLbl">Class level</span>
      <div class="seg" id="segClass">
        <label><input type="radio" name="classLevel" value="11" checked><span>Class 11</span></label>
        <label id="class12Label"><input type="radio" name="classLevel" value="12"><span>Class 12</span></label>
      </div>
    </div>

    <div class="field" id="sectionField">
      <span class="label" id="sectionLbl">Section</span>
      <div class="seg" id="segSection" role="radiogroup" aria-labelledby="sectionLbl">
        <label><input type="radio" name="section" value="A"><span>Section A</span></label>
        <label><input type="radio" name="section" value="B"><span>Section B</span></label>
      </div>
      <div class="seg" id="segSectionMulti" role="group" aria-labelledby="sectionLbl" hidden>
        <label><input type="checkbox" name="sectionMulti" value="A"><span>Section A</span></label>
        <label><input type="checkbox" name="sectionMulti" value="B"><span>Section B</span></label>
      </div>
    </div>

    <button type="submit" class="submit" id="submitBtn">
      <span class="spinner light" aria-hidden="true"></span>
      <span id="submitLabel">Save and continue</span>
    </button>

    <button type="button" class="link signout" id="signOutBtn">Use a different account</button>
  </form>

  <div class="foot">Powered by <strong>Doroi</strong></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/firebase-config.js"></script>
<script>
(function () {
  var MAX_SIDE = 640;
  var DEFAULT_AVATAR = "/favicon.png";
  var SUBJ = typeof SUBJECTS !== "undefined" ? SUBJECTS : ["Economic", "Account", "Computer Science", "English", "Nepali"];

  var form = document.getElementById("setupForm");
  var loadingBox = document.getElementById("loadingBox");
  var errorBox = document.getElementById("errorBox");
  var avatarBtn = document.getElementById("avatarBtn");
  var avatarImg = document.getElementById("avatarImg");
  var fileInput = document.getElementById("fileInput");
  var photoHint = document.getElementById("photoHint");
  var removePhoto = document.getElementById("removePhoto");
  var nameInput = document.getElementById("fullName");
  var emailInput = document.getElementById("email");
  var phoneInput = document.getElementById("phone");
  var submitBtn = document.getElementById("submitBtn");
  var submitLabel = document.getElementById("submitLabel");
  var signOutBtn = document.getElementById("signOutBtn");
  var lockNote = document.getElementById("lockNote");
  var headTitle = document.getElementById("headTitle");
  var headSub = document.getElementById("headSub");
  var subjectField = document.getElementById("subjectField");
  var segSubject = document.getElementById("segSubject");
  var segClass = document.getElementById("segClass");
  var class12Label = document.getElementById("class12Label");
  var segSection = document.getElementById("segSection");
  var segSectionMulti = document.getElementById("segSectionMulti");
  var sectionLbl = document.getElementById("sectionLbl");
  var groups = {
    gender: [document.getElementById("segGender")],
    classLevel: [segClass],
    section: [segSection, segSectionMulti],
    subject: [segSubject]
  };

  var currentUser = null;
  var locked = { fullName: false, phone: false, gender: false, classLevel: false, section: false, subject: false, photo: false };
  var isProf = false;
  var existingPhoto = "";
  var newPhotoBlob = null;
  var previewUrl = "";
  var busy = false;
  var started = false;

  function readNext() {
    var raw = new URLSearchParams(location.search).get("next") || "";
    if (!/^\/[A-Za-z0-9_\-\/.]*([?#][^\s]*)?$/.test(raw)) return "/";
    if (raw.indexOf("//") !== -1 || raw.indexOf("..") !== -1) return "/";
    return raw;
  }

  var nextUrl = readNext();

  function filled(v) {
    return typeof v === "string" && v.trim() !== "";
  }

  function isComplete(p) {
    if (!p) return false;
    var base = filled(p.fullName) && filled(p.phone) && filled(p.gender) &&
      filled(String(p.classLevel || "")) && filled(p.section);
    if (!base) return false;
    if (String(p.role || "").toLowerCase() === "professor") return filled(p.assignedSubject);
    return true;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add("visible");
    errorBox.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.classList.remove("visible");
  }

  function setBusy(isBusy) {
    busy = isBusy;
    submitBtn.disabled = isBusy;
    avatarBtn.disabled = isBusy || locked.photo;
    removePhoto.disabled = isBusy;
    signOutBtn.disabled = isBusy;
    submitBtn.classList.toggle("loading", isBusy);
    submitLabel.textContent = isBusy ? "Saving..." : "Save and continue";
  }

  function radioValue(name) {
    var r = form.querySelector('input[name="' + name + '"]:checked');
    return r ? r.value : "";
  }

  function setRadio(name, value) {
    Array.prototype.forEach.call(form.querySelectorAll('input[name="' + name + '"]'), function (r) {
      r.checked = !!value && r.value === String(value);
    });
  }

  function sectionValue() {
    if (!isProf) return radioValue("section");
    var picked = [];
    Array.prototype.forEach.call(form.querySelectorAll('input[name="sectionMulti"]:checked'), function (c) {
      picked.push(c.value);
    });
    return picked.sort().join(",");
  }

  function setSection(value) {
    var parts = String(value || "").split(",").map(function (s) { return s.trim(); });
    setRadio("section", value);
    Array.prototype.forEach.call(form.querySelectorAll('input[name="sectionMulti"]'), function (c) {
      c.checked = parts.indexOf(c.value) !== -1;
    });
  }

  function buildSubjects() {
    segSubject.textContent = "";
    SUBJ.forEach(function (name) {
      var label = document.createElement("label");
      var input = document.createElement("input");
      input.type = "radio";
      input.name = "assignedSubject";
      input.value = name;
      var span = document.createElement("span");
      span.textContent = name;
      label.appendChild(input);
      label.appendChild(span);
      segSubject.appendChild(label);
    });
  }

  function applyRoleUi() {
    headTitle.textContent = isProf ? "Set up your professor account" : "Set up your account";
    headSub.textContent = isProf
      ? "Add your photo, details and the subject you teach."
      : "Add your photo and details so classmates can recognise you.";
    subjectField.hidden = !isProf;
    segSection.hidden = isProf;
    segSectionMulti.hidden = !isProf;
    class12Label.hidden = isProf;
    segClass.classList.toggle("single", isProf);
    sectionLbl.textContent = isProf ? "Sections you teach" : "Section";
    if (isProf) setRadio("classLevel", "11");
  }

  function renderPhoto() {
    var src = previewUrl || existingPhoto || DEFAULT_AVATAR;
    avatarImg.src = src;
    var has = !!(previewUrl || existingPhoto);
    photoHint.textContent = has ? "Tap the photo to change it" : "Tap to add a profile photo";
    removePhoto.hidden = locked.photo || !has;
    if (locked.photo) photoHint.textContent = "Profile photo already saved";
  }

  function applyLocks(p) {
    locked.fullName = filled(p.fullName);
    locked.phone = filled(p.phone);
    locked.gender = filled(p.gender);
    locked.classLevel = filled(String(p.classLevel || ""));
    locked.section = filled(p.section);
    locked.subject = isProf && filled(p.assignedSubject);
    locked.photo = filled(p.profileImageUrl);

    nameInput.readOnly = locked.fullName;
    phoneInput.readOnly = locked.phone;
    ["gender", "classLevel", "section", "subject"].forEach(function (key) {
      groups[key].forEach(function (seg) {
        seg.classList.toggle("locked", locked[key]);
        Array.prototype.forEach.call(seg.querySelectorAll("input"), function (r) {
          r.disabled = locked[key];
        });
      });
    });
    avatarBtn.disabled = locked.photo;
    avatarBtn.classList.toggle("locked", locked.photo);

    var any = Object.keys(locked).some(function (k) { return locked[k]; });
    lockNote.textContent = any
      ? "Details you already saved are locked. Fill in the missing ones. This can only be done once, so double-check before saving."
      : "You can set these details only once, so double-check before saving.";
  }

  function resizeImage(file, maxSide) {
    var source = window.createImageBitmap
      ? createImageBitmap(file, { imageOrientation: "from-image" })
      : Promise.reject(new Error("unsupported"));

    return source.then(function (bmp) {
      var scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      var w = Math.round(bmp.width * scale);
      var h = Math.round(bmp.height * scale);
      var canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
      return new Promise(function (resolve) {
        canvas.toBlob(function (blob) {
          resolve(blob || file);
        }, "image/jpeg", 0.88);
      });
    }).catch(function () {
      return file;
    });
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        resolve(String(reader.result || "").split(",")[1] || "");
      };
      reader.onerror = function () {
        reject(new Error("Could not read image"));
      };
      reader.readAsDataURL(blob);
    });
  }

  function uploadPhoto(blob) {
    return Promise.all([blobToBase64(blob), currentUser.getIdToken()]).then(function (parts) {
      if (!parts[0]) throw new Error("Empty image");
      return fetch("/api/upload", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + parts[1]
        },
        body: JSON.stringify({ image: parts[0] })
      });
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (data) {
        if (!res.ok || !data || !data.url) {
          throw new Error((data && data.error) || "Upload failed");
        }
        return data.url;
      });
    });
  }

  function validate() {
    if (!locked.fullName && nameInput.value.trim().length < 2) return { msg: "Enter your full name.", el: nameInput };
    if (!locked.phone && !/^9[78]\d{8}$/.test(phoneInput.value.trim())) return { msg: "Enter a valid 10-digit phone number (starts with 97 or 98).", el: phoneInput };
    if (!locked.gender && !radioValue("gender")) return { msg: "Select your gender." };
    if (isProf && !locked.subject && !radioValue("assignedSubject")) return { msg: "Select your assigned subject." };
    if (!locked.classLevel && !radioValue("classLevel")) return { msg: "Select your class level." };
    if (!locked.section && !sectionValue()) return { msg: isProf ? "Select at least one section." : "Select your section." };
    return null;
  }

  function saveProfile(photoUrl) {
    var ref = db.ref("users").child(currentUser.uid);
    var fullName = nameInput.value.trim();
    return ref.once("value").then(function (snap) {
      var old = snap.val() || {};
      var data = {
        uid: currentUser.uid,
        email: currentUser.email || old.email || "",
        role: old.role || "student",
        createdAt: old.createdAt || firebase.database.ServerValue.TIMESTAMP
      };
      if (!locked.fullName) data.fullName = fullName;
      if (!locked.phone) data.phone = "+977 " + phoneInput.value.trim();
      if (!locked.gender) data.gender = radioValue("gender");
      if (!locked.classLevel) data.classLevel = isProf ? "11" : radioValue("classLevel");
      if (!locked.section) data.section = sectionValue();
      if (isProf && !locked.subject) data.assignedSubject = radioValue("assignedSubject");
      if (!locked.photo) {
        data.profileImageUrl = photoUrl !== null ? photoUrl : (old.profileImageUrl || currentUser.photoURL || "");
      }
      return ref.update(data);
    }).then(function () {
      if (locked.fullName) return;
      return currentUser.updateProfile({ displayName: fullName }).catch(function () {});
    });
  }

  avatarBtn.addEventListener("click", function () {
    if (!busy && !locked.photo) fileInput.click();
  });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!file || locked.photo) return;
    if (!/^image\//.test(file.type)) {
      showError("Please choose an image file.");
      return;
    }
    clearError();
    resizeImage(file, MAX_SIDE).then(function (blob) {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      newPhotoBlob = blob;
      previewUrl = URL.createObjectURL(blob);
      renderPhoto();
    });
  });

  removePhoto.addEventListener("click", function () {
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = "";
    newPhotoBlob = null;
    existingPhoto = "";
    renderPhoto();
  });

  phoneInput.addEventListener("input", function () {
    if (locked.phone) return;
    phoneInput.value = phoneInput.value.replace(/\D/g, "").slice(0, 10);
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy || !currentUser) return;
    clearError();

    var problem = validate();
    if (problem) {
      showError(problem.msg);
      if (problem.el) problem.el.focus();
      return;
    }

    setBusy(true);

    var photoStep;
    if (locked.photo) {
      photoStep = Promise.resolve(null);
    } else if (newPhotoBlob) {
      photoStep = uploadPhoto(newPhotoBlob).catch(function (err) {
        throw new Error("Couldn't upload your photo: " + (err && err.message ? err.message : "try again") + ". You can remove it and add it later from your profile.");
      });
    } else {
      photoStep = Promise.resolve(existingPhoto ? null : "");
    }

    photoStep.then(function (url) {
      return saveProfile(url).then(function () {
        location.replace(nextUrl);
      }, function () {
        throw new Error("Couldn't save your details. Please try again.");
      });
    }).catch(function (err) {
      setBusy(false);
      showError(err && err.message ? err.message : "Something went wrong. Please try again.");
    });
  });

  signOutBtn.addEventListener("click", function () {
    if (busy) return;
    auth.signOut().then(function () {
      location.replace("/");
    });
  });

  function start(user) {
    if (started) return;
    started = true;
    currentUser = user;
    buildSubjects();

    db.ref("users").child(user.uid).once("value").then(function (snap) {
      var p = snap.val() || {};
      if (isComplete(p)) {
        location.replace(nextUrl);
        return;
      }
      isProf = String(p.role || "").toLowerCase() === "professor";
      applyRoleUi();
      applyLocks(p);
      nameInput.value = p.fullName || user.displayName || "";
      emailInput.value = user.email || p.email || "";
      phoneInput.value = String(p.phone || "").replace(/^\+977/, "").replace(/\D/g, "").slice(0, 10);
      setRadio("gender", p.gender);
      setRadio("classLevel", isProf ? "11" : (p.classLevel || "11"));
      setSection(p.section);
      setRadio("assignedSubject", p.assignedSubject);
      existingPhoto = (typeof p.profileImageUrl === "string" && p.profileImageUrl) || user.photoURL || "";
      renderPhoto();
      loadingBox.hidden = true;
      form.hidden = false;
    }).catch(function () {
      loadingBox.hidden = true;
      form.hidden = false;
      emailInput.value = user.email || "";
      nameInput.value = user.displayName || "";
      renderPhoto();
      showError("Couldn't load your profile. You can still fill in your details.");
    });
  }

  auth.onAuthStateChanged(function (user) {
    if (user) start(user);
  });
})();
</script>
</body>
</html>
