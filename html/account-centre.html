<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fe">
<title>Account Center · Durbar</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/img-fix.js"></script>
<link rel="stylesheet" href="/css/pages.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/account-centre.css">
</head>
<body>

<nav class="side-nav" aria-label="Main">
  <a class="nav-item" href="/">
    <svg class="fill-on-active" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a.5.5 0 0 1-.5.5H15v-6H9v6H4.5a.5.5 0 0 1-.5-.5V11z"/></svg>
    <span>Home</span>
  </a>
  <a class="nav-item" href="/#shorts">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3.5"/><path d="M10 9.2v5.6l4.6-2.8L10 9.2z"/><path d="M8 4l2 3.2M13 4l2 3.2"/></svg>
    <span>Shorts</span>
  </a>
  <a class="nav-item" href="/#subject">
    <svg class="fill-on-active" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M5 16.5h14M9 20.5v-1.5M15 20.5v-1.5"/></svg>
    <span>Subject</span>
  </a>
  <span class="nav-sep"></span>
  <a class="nav-item" href="/html/profile.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    <span>Profile</span>
  </a>
  <a class="nav-item active" href="/html/setting.html">
    <svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9M4 12h5M15 12h5"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/><circle cx="12" cy="12" r="2.5"/></svg>
    <span>Settings</span>
  </a>
</nav>

<header class="top-bar">
  <a class="round-btn" id="backBtn" href="/html/setting.html" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <h1 class="page-title">Account Center</h1>
</header>

<main class="account">

  <section class="hero">
    <img class="hero-avatar" id="heroAvatar" src="/favicon.png" alt="Profile photo">
    <h2 class="hero-name" id="heroName">&nbsp;</h2>
    <p class="hero-email" id="heroEmail">&nbsp;</p>
    <span class="hero-role" id="heroRole" hidden></span>
  </section>

  <section class="group">
    <h3 class="group-title">Profile</h3>
    <div class="group-card">
      <button class="row" type="button" id="nameRow">
        <span class="row-icon tone-blue">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        </span>
        <span class="row-text">
          <span class="row-label">Name</span>
          <span class="row-sub" id="nameSub"></span>
        </span>
        <svg class="row-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="row" type="button" id="phoneRow">
        <span class="row-icon tone-green">
          <svg viewBox="0 0 24 24"><path d="M5 4h3.5l1.5 4-2 1.5a11 11 0 0 0 6.5 6.5L16 14l4 1.5V19a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
        </span>
        <span class="row-text">
          <span class="row-label">Phone Number</span>
          <span class="row-sub" id="phoneSub"></span>
        </span>
        <svg class="row-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <section class="group">
    <h3 class="group-title">Security</h3>
    <div class="group-card">
      <button class="row" type="button" id="passRow">
        <span class="row-icon tone-purple">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
        </span>
        <span class="row-text">
          <span class="row-label">Email and Password</span>
        </span>
        <span class="pill action" id="passPill">Create</span>
      </button>
      <button class="row" type="button" id="googleRow">
        <span class="row-icon tone-grey">
          <svg class="g" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.2 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8l3.6-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.4 9.1 5.4 12 5.4z"/></svg>
        </span>
        <span class="row-text">
          <span class="row-label">Google</span>
        </span>
        <span class="pill action" id="googlePill">Link</span>
      </button>
      <button class="row" type="button" id="changePassRow" hidden>
        <span class="row-icon tone-orange">
          <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
        </span>
        <span class="row-text">
          <span class="row-label">Change Password</span>
        </span>
        <svg class="row-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="row danger" type="button" id="deleteRow">
        <span class="row-icon tone-red">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>
        </span>
        <span class="row-text">
          <span class="row-label">Delete Account</span>
        </span>
        <svg class="row-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </section>

</main>

<div class="sheet-overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <h3 class="sheet-title" id="sheetTitle"></h3>
    <p class="sheet-desc" id="sheetDesc" hidden></p>
    <div class="sheet-error" id="sheetError" role="alert"></div>
    <form id="sheetForm" novalidate>
      <div class="sheet-fields" id="sheetFields"></div>
      <button type="submit" class="sheet-primary" id="sheetSubmit">
        <span class="btn-spin" aria-hidden="true"></span>
        <span id="sheetSubmitLabel"></span>
      </button>
      <button type="button" class="sheet-cancel" id="sheetCancel">Cancel</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/firebase-config.js"></script>
<script src="/js/account-centre.js"></script>

</body>
</html>
